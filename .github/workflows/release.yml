name: Release

on:
  push:
    branches: [pew-main]
    paths:
      - ".github/workflows/release.yml"
      - "packages/**"
      - ".changeset/**"
      - "pnpm-lock.yaml"
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

env:
  CI: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLISH_SUMMARY_PATH: publish-summary.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          scope: "@readdle"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Restore build cache
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
          key: build-${{ hashFiles('packages/*/src/**', 'pnpm-lock.yaml') }}

      - name: Build packages
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm run build:packages-react

      # Changesets will either open a version PR or publish if already versioned
      - name: Version / Publish via Changesets
        id: changesets
        uses: changesets/action@v1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit: "chore: version packages"
          title:  "chore: version packages"
          publish: pnpm ci:publish:readdle
          createGithubReleases: false

      # Robust publish detection via the file your ci:publish writes
      - name: Detect publish summary
        id: published
        run: |
          if [ -f "publish-summary.json" ]; then
            COUNT=$(jq '.publishedPackages | length' publish-summary.json 2>/dev/null || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              echo "did_publish=true" >> $GITHUB_OUTPUT
              echo "published=$(jq -c '.publishedPackages' publish-summary.json)" >> $GITHUB_OUTPUT
              echo "version=$(jq -r '.publishedPackages[0].version' publish-summary.json)" >> $GITHUB_OUTPUT
            else
              echo "did_publish=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "did_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Get merged PR info
        if: steps.published.outputs.did_publish == 'true'
        id: merged_pr
        uses: actions-ecosystem/action-get-merged-pull-request@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release notes
        if: steps.published.outputs.did_publish == 'true'
        env:
          PR_BODY: ${{ steps.merged_pr.outputs.body }}
        run: |
          echo "$PR_BODY" | sed -n '/# Releases/,$p' | tail -n +2 > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Automated release." > release-notes.md
          fi
          echo "Release notes:"
          cat release-notes.md

      - name: Package published dists
        if: steps.published.outputs.did_publish == 'true'
        env:
          PUBLISHED_JSON: ${{ steps.published.outputs.published }}
        run: |
          mkdir -p release-assets
          echo "$PUBLISHED_JSON" | jq -r '.[].name' | while read name; do
            # publish-summary uses @readdle/embedpdf-<suffix>; map to packages/<suffix> or viewers/*
            short="${name#@readdle/embedpdf-}"
            if [ "$short" = "$name" ]; then
              short=$(echo "$name" | sed 's!.*/!!')
            fi
            # Handle viewers (snippet, react, vue, svelte) which are in viewers/
            if [ "$short" = "snippet" ] || [ "$short" = "react-pdf-viewer" ] || [ "$short" = "vue-pdf-viewer" ] || [ "$short" = "svelte-pdf-viewer" ]; then
              # Map package name to directory name
              case "$short" in
                "react-pdf-viewer") dir="viewers/react" ;;
                "vue-pdf-viewer") dir="viewers/vue" ;;
                "svelte-pdf-viewer") dir="viewers/svelte" ;;
                *) dir="viewers/$short" ;;
              esac
            else
              dir="packages/$short"
            fi
            if [ -d "$dir/dist" ]; then
              echo "Packaging $short from $dir"
              (cd "$dir" && zip -r "../../release-assets/${short}-dist.zip" dist >/dev/null 2>&1 || zip -r "../release-assets/${short}-dist.zip" dist >/dev/null)
              tar -czf "release-assets/${short}-dist.tar.gz" -C "$dir" dist
            else
              echo "No dist for $short"
            fi
          done
          ls -lh release-assets || true

      - name: Create GitHub Release (draft)
        if: steps.published.outputs.did_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.published.outputs.version }}
          name: Release v${{ steps.published.outputs.version }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
